# Real T2 Cruza tiltrotor, Pixracer Pro, PX4 v1.16.0-rc.
#
# Derived from the vehicle's own parameter dump where the dump settles it, and
# MARKED "MEASURE" where it does not. Every MEASURE item is a number the
# simulator supplied for free and the aircraft will not.
#
# Read the differences from t2_param.yaml first -- they are the whole point of a
# separate file, and three of them are flight-critical.
/**:
  ros__parameters:
    uav_parameters:
      # MEASURE, and there is a live discrepancy to resolve first: the CAD mass
      # properties read 2363.35 g, this file and t2_param.yaml say 2486 g -- 5.2%
      # apart. The CAD's INERTIA matches the config to seven digits, so the two
      # came from the same model and only the mass has moved since.
      #
      # Weigh the aircraft as flown (battery, Pi 5, camera, cabling, tape) rather
      # than trusting either. Mass sets hover thrust directly, and the
      # external-force observer absorbs the error up to kFextMaxHoverFraction
      # (30% of weight) before it saturates -- so a 5% error is not dangerous,
      # but it is a permanent feedforward bias standing in for nothing.
      mass: 2.387
      arm_length: 0.25             # NOT USED for num_of_arms 3
      num_of_arms: 3
      # FROM CAD, and confirmed against it: the diagonal matches the mass
      # properties to seven digits (80868508.29 g.mm^2 = 0.0808685 kg.m^2, etc).
      #
      # ixz is the ONE off-diagonal worth carrying, and the airframe's own
      # symmetry says why. The aircraft is symmetric about x, so the x-z plane is
      # a symmetry plane, which forces ixy = iyz = 0 exactly -- and the CAD agrees,
      # putting both at 0.07% and 0.015% of sqrt(Ii*Ij), i.e. numerical dust. That
      # symmetry does NOT constrain ixz, the fore-aft/vertical product, and the
      # CAD puts it at 1.97%. It shows up in the CAD's principal axes as
      # Ix = (1.00, 0.00, -0.02): the principal axis tilted ~1.1 deg from body x.
      #
      # 2% is well inside what the sliding-mode reaching gains are there to
      # reject, and every chattering and landing result in CLAUDE.md was measured
      # with it at zero, so this is not expected to change anything measurable.
      # It is carried because it is free and it is real.
      inertia:
        ixx: 0.0808685
        iyy: 0.1256707
        izz: 0.2036992
        ixy: 0.0
        ixz: -0.0025341
        iyz: 0.0
      # 0.05 -> 0.018 (10 Sep). The vehicle's CA_ROTOR0_KM is ALSO 0.05, but that
      # is not an independent cross-check: both are PX4's generic `tiltrotor`
      # default and neither was identified for this airframe. 0.018 is derived
      # from the FX-3110-680KV datasheet -- hover power at 60%, 70-80% efficiency,
      # km = Q/T -- i.e. from the motor actually fitted here. PX4's x500 is 0.016.
      #
      # THE ERROR IS ASYMMETRIC, which is what settles it while km is unmeasured.
      # At hover (m 2.387, all three rotors at 7.805 N, denom = 3.356 N.m/rad):
      #   km 0.018 -> -2.40 deg of differential tilt, 4.10 deg of margin
      #   km 0.050 -> -6.66 deg, i.e. PAST the +-6.5 deg clamp at ZERO yaw error
      # Under-estimating km leaves a residual the yaw integral reclaims;
      # over-estimating it pins the servo and deletes the yaw axis. That is the
      # log_20 spin.
      #
      # TO MEASURE IT, now that rotor_yaw_signs is correct: fly a PX4-STABILISED
      # hover, let the heading settle, and read the steady differential tilt.
      # km = denom*tilt / (ct*omega^2). A reading taken while the aircraft is
      # yawing is NOT an equilibrium and must not be inverted.
      moment_constant: 0.018
      # MEASURE ON A THRUST STAND. 1.6e-05 N.s^2/rad^2 is the Gazebo rotor.
      # The vehicle's CA_ROTOR*_CT is 13.0 N at full command, which for three
      # rotors is 39 N against a ~24.4 N hover -- consistent with a ~63% hover
      # command, but CT is PX4's own linear-in-command coefficient and is NOT
      # this quadratic-in-omega constant. They are different models; do not
      # convert one into the other and call it identified.
      thrust_constant: 1.6e-05
      gravity: 9.81
      pitch_trim_deg: 0.0
      # x_0 IDENTIFIED from a manual hover (log_15_2026-9-3, five steady windows).
      # x_2 and x_1 are still the x500's -- only the OFFSET has been fitted, which
      # pins the operating point and not the slope.
      #
      # Measured: mean PWM 1579.0 us against the 1633.6 us this curve predicted for
      # a tilt-corrected 7.849 N per rotor, i.e. it over-predicted by 54.6 us
      # (6.8% of the command range). x_0 914.2 -> 859.6.
      #
      # The correction is voltage-dependent, and visibly so: the windows at 21.87 V
      # fit x_0 = 847-854 and those at 21.45 V fit 862-868. Nothing in the output
      # path compensates for pack voltage (the mixer module has no battery scaling),
      # so expect about +/-8 us of drift across a flight. 859.6 is the mean.
      #
      # THE SLOPE DOES NOT NEED A SECOND FLIGHT, and this was checked rather than
      # assumed. The same log already spans 6.15-10.21 N per rotor (a 66% range
      # around the 7.81 N hover, wider than a 500 g added mass would give), so the
      # curve's SHAPE can be tested against it directly: pair the body-z specific
      # force from sensor_combined -- which needs no altitude, and this flight's
      # altitude was unusable -- with the commanded PWM.
      #
      # Refitting all three coefficients over that span comes out DEGENERATE
      # (x_2 0.0122, x_1 -16.6, x_0 7229) and improves the residual from 50.1 to
      # 46.8 us, i.e. three parameters buy 7%. The residual binned by thrust is
      # flat to within its own scatter across the middle bins, so there is no
      # systematic shape error to find -- only the offset was wrong, and it is
      # corrected above. An offset-only fit over the whole flight independently
      # gives x_0 = 869.1 against the 859.6 from the steady hovers: consistent.
      #
      # A thrust stand (scripts/identification.py, RCbenchmark CSV) would still do
      # better, because it measures omega and can separate thrust_constant from
      # this curve. Another hover would not.
      omega_to_pwm_coefficient:
        x_2: 0.001142
        x_1: 0.2273
        x_0: 859.6
      # FROM THE VEHICLE: PWM_MAIN_MIN/MAX on the motor outputs (MAIN3, MAIN7,
      # MAIN8 -> functions 103, 102, 101) are 1100 and 1900. The 1075/1950 in
      # t2_param.yaml is the SITL airframe and would misscale every throttle.
      PWM_MIN: 1100
      PWM_MAX: 1900
      # Unused when sitl_mode is false; kept so one node reads either file.
      SIM_GZ_EC_MAX: 1500
      SIM_GZ_EC_MIN: 0
      # FROM THE VEHICLE, and this is the flight-critical one.
      #
      # PX4 assigns servo output functions CONTROL SURFACES FIRST, THEN TILTS
      # (ActuatorEffectivenessTiltrotorVTOL::getEffectivenessMatrix). The gz
      # airframe has CA_SV_CS_COUNT 4, putting the tilts on Servo 5 and 6 =
      # indices 4 and 5. This vehicle has CA_SV_CS_COUNT 3, putting them on
      # Servo 4 and 5 = indices 3 and 4.
      #
      # Confirmed independently by the output map: MAIN6 -> function 204
      # (Servo 4) and MAIN5 -> function 205 (Servo 5) are the only two outputs
      # with individually calibrated travel (1000/1875 and 1150/2025), which is
      # what per-servo tilt trim looks like. Everything else is 1100/1900.
      #
      # With the SITL indices the code would write tilt_1 to Servo 5, tilt_2 to
      # an unmapped Servo 6, and leave Servo 4 commanded to 0.0 -- one tilt
      # frozen while the other tracks. Differential tilt IS the yaw axis here.
      tilt_1_servo_index: 3
      tilt_2_servo_index: 4
      # MEASURED IN FLIGHT, and it is the reason the first STSMC flight span up.
      # A positive commanded differential tilt produces a NEGATIVE yaw moment on
      # this aircraft, the opposite of the simulator. With +1 the yaw loop is
      # positive feedback: log_20 reached -292 deg/s and 585 deg of rotation
      # within 3 s of offboard entry, both tilt servos pinned at their clamps,
      # while roll and pitch stayed bounded. Correlation between commanded
      # differential and yaw acceleration: -0.882.
      # Back to +1. The -1 was aimed at the wrong term: it happened to correct the
      # feedforward's sign by accident while inverting the damping response, which
      # is why the bench test still looked wrong. The real fault is rotor_yaw_signs.
      tilt_yaw_sign: 1.0
      # Spin direction of each rotor's yaw torque, body FLU, in the order
      # [front-right, front-left, tail]. MEASURED ON THE AIRCRAFT: front right is
      # CCW, front left and tail are CW.
      #
      # The simulator's tail turns the OTHER WAY (gz airframe CA_ROTOR2_KM +0.05,
      # this vehicle -0.05), which is why the hardcoded (-1, +1, -1) flew every
      # SITL landing and then saturated the tilt the wrong way on the real T2.
      rotor_yaw_signs: [-1.0, 1.0, 1.0]
      # FROM THE VEHICLE: CA_SV_TL0_MINA/MAXA are -5 and 90, against the SITL
      # airframe's -7 and 90.
      #
      # VERIFY ON THE BENCH ANYWAY. In offboard direct-actuator mode PX4's
      # allocator is bypassed, so CA_SV_TL*_MINA/MAXA are NOT applied to what we
      # publish: the value goes straight to output scaling, where -1 is
      # PWM_MAIN_MIN<n> and +1 is PWM_MAIN_MAX<n>. What these numbers must match
      # is the PHYSICAL angle at those two PWM values. Command -1, 0 and +1 with
      # the props off and measure the tilt with an inclinometer.
      tilt_min_deg: -6.5
      tilt_max_deg: 90.0

    landing_parameters:
      # Ground radius the camera can see per metre of height. The node's default
      # is 1.19, which is the SIMULATOR's camera (mono_cam/model.sdf,
      # horizontal_fov 1.74 rad = 99.7 deg). The real T2 carries a Raspberry Pi
      # Camera Module 3 (standard, 66 deg HFOV on a 16:9 sensor) requested at
      # 1920x1200, i.e. 16:10, so libcamera crops ~11% of the width to make the
      # aspect. Measured from the flight calibration (fx = fy = 1698.8, 1920x1200,
      # cx 1129.1 / cy 615.6):
      #
      #   HFOV 58.9 deg, VFOV 38.9 deg
      #   half-angle slopes  left 0.665  right 0.466  up 0.362  down 0.344
      #   INSCRIBED (guaranteed) radius  0.344 * h      <- this value
      #   corner (best case)             0.757 * h
      #
      # The VERTICAL field is what binds, and it is already almost the full sensor
      # height -- which is why running the camera at full resolution buys only
      # ~6% here (0.344 -> 0.365) and costs 5x the detector CPU. The lever, if
      # more footprint is ever wanted, is the WIDE module: 0.695 * h, i.e. 2x.
      #
      # A BENCH MEASUREMENT WAS TAKEN (11 Sep) AND IS NOT USED. Height 29.5 units,
      # detection lost at 13.5 off-axis on the short axis and 16.5 on the long one,
      # i.e. slopes 0.458 and 0.559. Rejected because it is internally impossible
      # and externally contradicted:
      #
      #  - INTERNALLY: the two axes give a ratio of 1.22. A 1920x1200 frame forces
      #    1.60, and no tag-size correction can reconcile them -- solving for the
      #    tag half-extent that would make both fit returns a NEGATIVE number. One
      #    camera cannot have two focal lengths (1311 px from the short axis,
      #    1716 px from the long one, against 1698.8 calibrated).
      #  - EXTERNALLY, twice, from the 10 Sep flight bags:
      #      * tag-derived depth (size*fx/edge_px) against the RANGEFINDER, which
      #        knows nothing about the camera: 95 paired samples over 2.5-4.8 m
      #        give a median ratio of 1.032, i.e. fx = 1646 against 1699 -- 3%.
      #      * the outermost successfully-detected tag CORNER over those flights
      #        reached 0.326 on the short axis and never once crossed the 0.344
      #        the calibration predicts. The bench number puts the edge 33% past a
      #        boundary that real detections respected.
      #
      # The likely bench error is camera tilt (a tilted camera makes the footprint
      # a trapezoid and the floor distance is no longer the perpendicular one) or
      # measuring at 0.75 m, where the tag's own 0.467 m black extent dominates the
      # geometry. If it is ever repeated: do it at FLIGHT height, level the
      # airframe, plumb-line the nadir, measure to the TAG CENTRE, and use
      # slope = (offset + 0.2335) / height -- 0.2335 m being half the BLACK extent,
      # not half the 0.35 m "size", which is only the inner white square.
      #
      # 0.344 also errs in the SAFE direction: too small makes the ladder climb
      # sooner, which is the designed response and genuinely gains footprint. Too
      # large is what stopped it climbing at all and cost the 10 Sep landings.
      camera_footprint_slope: 0.344

      # ---- Commit altitude -------------------------------------------------
      # 0.30 m is SITL's, where the lidar reports min_distance 0.1 m and goes
      # blind at ~0.245 m of body height. The T2's rangefinder DECLARES
      # min_distance 0.40 m (read straight off /fmu/out/distance_sensor), so at
      # 0.30 m the commit decision was being taken inside the blind zone on a
      # dead-reckoned altitude -- exactly what the constant exists to prevent.
      #
      # 0.55 m clears the declared minimum with margin. It is also the tag-loss
      # ladder's no-escalation floor, so it is what keeps the failsafe off a
      # nearly-landed aircraft: on 12 Sep the ladder aborted at 0.43 m with
      # 0.07 m of XY error, which the 0.30 m floor was 13 cm too low to stop.
      #
      # Note the beam keeps reporting sensible values well below its declared
      # minimum (0.30, 0.22, 0.14, 0.03 m were all logged on the way down, with
      # signal_quality flipping -1 -> 0 at 0.40 m). If that is real rather than
      # an artefact, lowering min_distance in the driver would buy back the
      # terminal descent -- measure it against a tape before believing it.
      commit_altitude: 0.55

      filter:
        # ---- Why R is wider here than in SITL ------------------------------
        # These three terms are per-FRAME errors -- one attitude error, one
        # mounting error, one unknown delay -- turned into pixels by the focal
        # length. Hardware's fx is 1699 against SITL's 539, so the SAME physical
        # error costs 3.2x the pixels here, and on top of that the camera on
        # this airframe has never been calibrated: camera_offset_body is (0,0,0)
        # and camera_rotation_{z,x}_deg are the ideal 90/180.
        #
        # Measured over the four flights of 12 Sep, off /landing/filter_residual:
        #   reprojection residual  43-78 px p50   against R's predicted 29-46 px
        # i.e. R was about 2x overconfident, and the chi-squared gate therefore
        # threw away 72-83% of perfectly good detections. That starved the EKF,
        # which then held a stale position and JUMPED up to 0.44 m when a
        # measurement finally squeaked through, and the jumps drove the tag-loss
        # ladder through its whole budget in ~12 s of flight.
        #
        # Widening R by 3x in sigma takes the modelled reject fraction from
        # 72-83% to 4-13% (computed from the recorded NIS of all four flights).
        #
        # The 3x is MEASURED, not assumed: R's predicted residual is a matrix sum
        # in which the 1 px corner term survives untouched, so the inflation is
        # not the ratio of any single sigma. Driving the real filter offline at
        # the T2's own intrinsics gives 3.01x at 3 m on the 0.35 m tag and 3.00x
        # at 0.60 m on the 0.091 m one -- flat across the descent, which is what
        # says the attitude and extrinsic terms have been raised in the right
        # proportion to each other. An earlier pair (0.035 / 0.10) measured 2.48x
        # and left 12-22% still being rejected.
        #
        # HOW TO RETUNE: watch /landing/filter_residual. x is the measured RMS,
        # y is what R predicts. Aim for x/y near 1 and a reject fraction
        # (/landing/filter_nis z) under ~0.2. Wider is the safe direction while
        # the camera is uncalibrated; narrower only once it is.
        attitude_sigma: 0.045     # [rad] ~2.6 deg: EKF2 attitude PLUS the uncalibrated mounting
        extrinsic_sigma: 0.13     # [m]   camera_offset_body is (0,0,0) and unmeasured
        latency_sigma: 0.05       # [s]   measured stamp->arrival 0.22-0.25 s, spread ~40 ms

      # Shared with tag_ev_bridge_node so the estimator's input and the guidance
      # that consumes its output cannot disagree about the camera.
      #
      # FROM THE Pi's OWN STACK, not guessed. camera_ros declares
      # frame_id with a default of "camera" (CameraNode.cpp: declare_parameter
      # <std::string>("frame_id", "camera")) and the launch file on the Pi does not
      # override it, so the image header carries "camera". The detector copies that
      # header onto the platform transform verbatim
      # (AprilTagNode.cpp: platform_tf.header = msg_img->header), so "camera" is
      # the TF parent this node must look up. It was "camera_link_optical" here,
      # which is the Gazebo name and would have failed every lookup silently.
      camera_frame_id: "camera"
      platform_frame_id: "platform"
      world_frame_id: "world"
      camera_offset_body:
        x: 0.0
        y: 0.0
        z: 0.0
      # VERIFY AGAINST THE REAL MOUNTING. These two angles build R_b_cam (see
      # camera_extrinsics.h) and default to the SITL mounting. A 180 deg error
      # about the boresight here inverts BOTH lateral axes, which reads as the
      # aircraft being on the opposite side of the pad -- it lived in this
      # project undetected through three roadmap items, because a synthetic tag
      # shares the constant with the code it feeds and the error cancels.
      #
      # Check it on the ground: park the aircraft a known distance north-east of
      # the tag with the camera seeing it, and confirm /landing/ev_position has
      # the signs you expect on both axes before arming.
      camera_rotation_z_deg: 90.0
      camera_rotation_x_deg: 180.0

      # Both confirmed against the Pi's camera_36h11.launch.yml: the apriltag node
      # runs in namespace "apriltag" (-> /apriltag/detections) and camera_ros in
      # namespace "camera" with node name "camera" (-> /camera/camera/camera_info).
      #
      # NOTE ON K vs P -- RESOLVED, nothing to do here. This used to be a real
      # scale error: the detector was fed the RECTIFIED image (whose intrinsics
      # are P) while this node read K, and on this lens they differ by 3-4%
      # (K fx 1698.8 cx 1129.1, P fx 1749.7 cx 1142.6). The detector now runs
      # on the RAW image and undistorts the four corners into K's frame, so the
      # corners on /apriltag/detections and the K this node reads describe the
      # same camera. Reading K here is now the correct thing to do -- do not
      # "fix" it to P, and do not republish a camera_info whose K equals P.
      detections_topic: "/apriltag/detections"
      camera_info_topic: "/camera/camera/camera_info"
      # MEASURE. The lidar is a Benewake TFmini (SENS_TFMINI_CFG 103) on this
      # aircraft, not the SITL LW20, so both the mounting and the minimum range
      # differ. Note the vehicle currently has EKF2_RNG_POS_X/Y/Z all at 0.0 and
      # EKF2_RNG_CTRL 1 (conditional) -- the same two defects the SITL work found
      # and fixed, still present here. Set the lever arm and use 2 (always on).
      rangefinder_offset_body:
        x: 0.15
        y: 0.0
        z: 0.0

      tag_ids: [2, 1]
      tag_families: ["Custom48h12", "36h11"]
      # MUST MATCH cfg/tags_36h11.yaml in apriltag_ros_enhanced. The two
      # families do not measure their size the same way: what the size means is
      # whatever the four detected corners span, which is the family's
      # width_at_border out of total_width. 36h11 is 8/10, the OUTER edge of
      # the black square. Custom48h12 is 6/10 with a reversed border, so it is
      # the INNER white square -- the inside of the black border -- and its
      # data bits sit outside that, which makes the printed tag look far
      # bigger. One cell here is 5.83 cm: inner square 0.35, black extent
      # 0.467, whole sheet 0.583. 0.467 was measured off the black and put
      # tag_48 at 1.134 m while the coplanar tag_36 read 0.834 m.
      tag_sizes: [0.35, 0.091]
      tag_positions_x: [0.0, 0.0]
      tag_positions_y: [0.0, 0.0]
      tag_positions_z: [0.0, 0.0]

    # External-vision bridge. Loose on purpose: an over-tight sigma is what makes
    # EKF2 gate the tag out during motion, and a starved EV fusion falls back to
    # the fake-position anchor silently. EKF2_EVP_NOISE is a LOWER bound on these.
    ev_bridge:
      sigma_xy_base: 0.03
      sigma_xy_per_metre: 0.02
      sigma_z_base: 0.05
      sigma_z_per_metre: 0.03
      max_range: 8.0

# HARDWARE-ONLY gain overlay. Loaded AFTER initial_gains_t2.yaml in
# t2_hw.launch.py, so it overrides it; SITL never loads this file and its
# baseline stays bit-exact.
#
# It exists because initial_gains_t2.yaml is SHARED between the two rigs, so a
# hardware-specific gain put there silently changes every SITL result as well --
# the class of unflagged baseline change this project has been bitten by
# repeatedly.
/**:
  ros__parameters:
    control_gains:
      # YAW rotational pair, halved for hardware bring-up (SITL: 0.075 / 0.015).
      #
      # Not general caution. On this tricopter yaw IS differential tilt, and
      # Gazebo models the tilt servo as a P-controlled joint with no dynamics at
      # all -- no lag, no backlash, no current limit. Roll and pitch act through
      # the rotors, whose lag IS modelled and has been validated at PLANT=centre
      # (36 ms, inside the real 25-56 ms), so they are deliberately unchanged.
      # The yaw path is the one thing SITL cannot speak to, on an axis with only
      # ~4 deg of authority, on the aircraft that span up on log_20.
      STA_K1_R_z: 0.0375
      STA_K2_R_z: 0.0075

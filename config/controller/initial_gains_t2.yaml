/**:
  ros__parameters:
    control_gains:
        # SMC Translational Control Parameters
        # Lambda: Natural frequency parameters for position/velocity dynamics
        Lambda_x: 1.5
        Lambda_y: 1.5
        Lambda_z: 3.0
        # K_s: Sliding mode gain - increase for faster convergence/disturbance rejection
        K_s_x: 1.0
        K_s_y: 1.0
        K_s_z: 1.5
        # Phi: Saturation layer thickness - prevents chattering
        Phi_x: 0.3
        Phi_y: 0.3
        Phi_z: 0.1

        # ===== External-force observer (roadmap item 8, review §05) =====
        # Bandwidth [rad/s] of the momentum-based disturbance observer whose
        # estimate is fed forward as -f_ext_hat in I_a_d. Shared by BOTH control
        # laws. 0.0 disables it, which is how it is A/B'd against one binary.
        #
        # THE 11.6 Hz CONSTRAINT ON THIS GAIN IS GONE, MEASURED 20 Aug. It was
        # real when it was found on 19 Aug and it does not reproduce now, and the
        # reason is dated rather than mysterious: the omega_ref low-pass below
        # shipped the DAY AFTER that sweep, and it cuts exactly the path that
        # turned this observer's velocity noise into 11.6 Hz torque.
        #
        #   m*K_o [N per m/s]  ->  I_a_d  ->  B_z_d direction  ->  R_d
        #     differenced at 100 Hz -> omega_ref -> tau via I*Lambda_R
        #
        # Doubling the bandwidth still doubles the force noise (2.49 -> 4.97 N
        # per m/s, which no filter changes), but the 2 Hz pole cuts the
        # conversion to 17% at 11.6 Hz, so the net is ~0.34x. Measured, stsmc,
        # still air, n=4 per side: EVERY chattering median is equal or lower at
        # 2.0 than at 1.0, the tilt rate limiter saturates on 0.00% of steps in
        # both, and the motor spectrum does NOT collapse onto 11.6 Hz (median
        # peak 24.3 Hz against the 11.5-11.7 Hz signature of the old failure).
        # smc, the rig the constraint was originally measured on, agrees.
        #
        # Landing, stsmc, n=6 tail-on and n=3 nose-on: 2.0 lands every run in
        # both directions with touchdown XY indistinguishable from 1.0. So 2.0
        # is now AVAILABLE and is not measurably BETTER -- the 19 Aug tail-on
        # advantage did not reproduce either, which is unsurprising since it was
        # measured on a loop that has since changed. Left at 1.0 for that reason,
        # not because raising it is unsafe. See CLAUDE.md, "The 11.6 Hz ceiling
        # on the observer bandwidth was the reference differentiation".
        # Bound on the external-force ESTIMATE, as a fraction of hover thrust.
        # MEASURED PINNED at 7.32 N (p50 = p95 = max = the bound) through a whole
        # 7.5 m/s / 90 deg flight -- so the feedforward was a constant 16.7 deg of
        # lean that could not respond to the wind. 0.30 is the historical value.
        # Commanded-lean limit [deg], PX4's MPC_TILTMAX_AIR equivalent. Neither
        # SMC law had one. Measured from the BodyAero plugin's own applied wrench
        # at 7.5 m/s / 90 deg: PX4 leans 7.1 deg and meets 3.02 N; the STSMC leans
        # 19.5 deg and meets 7.97 N (20.8 max) -- the aircraft MAKES its own
        # disturbance through 0.547 m2 of wing. 0.0 disables (bit-exact).
        tilt_max_deg: 0.0
        # Solution B: estimate d|F_aero|/d(lean) online by RLS on the (lean,
        # |f_ext_hat|) pairs the aircraft already produces, then bound the lean to
        # where b_eff = T*cos(theta) - g still buys net force. A DERIVED,
        # airspeed-dependent tilt limit -- no aero model, no wind estimator.
        # Forgetting factor; 0.0 disables the whole path bit-exactly. 0.995 ~ 200
        # samples of memory at 100 Hz.
        aero_rls_forget: 0.0
        f_ext_max_fraction: 0.30
        # Horizontal bound, separate from the vertical one. 0.0 = same as above
        # (bit-exact the old law). The clamp guards against the PAD pushing back,
        # which is vertical; wind is horizontal and needs more room.
        f_ext_max_fraction_xy: 0.0
        f_ext_observer_gain: 1.0

        # ===== Reference-rate filter on omega_ref [Hz]; 0.0 disables =====
        # The desired attitude is the DIRECTION of I_a_d, and omega_ref is that
        # attitude differenced at 100 Hz. I_a_d carries every feedback term the law
        # computes -- including the translational super-twisting output, whose time
        # derivative is unbounded as s -> 0 (slope K1/(2*sqrt(|s|)), plus w
        # integrating a sign()). So the one signal a super-twisting law
        # deliberately keeps continuous-but-not-smooth was being fed straight into
        # a differentiator, and the result re-entered tau with gain I*Lambda_R.
        #
        # Measured, stsmc, still-air hover: omega_ref_y carried 8.4x the
        # high-frequency energy of the ACTUAL body rate, peaking at 11.7 Hz -- the
        # limit cycle this project has chased since the chattering work began.
        # Filtering it at 2 Hz cuts that HF content to 7%, tau_y TV/s to 15%, and
        # the tilt rate-limiter saturation from 12.2% of steps to 0.8%.
        #
        # A reference angular velocity is only real below a few Hz on this mission:
        # static platform, slow approach, yaw pinned to the platform heading. Above
        # that it is the differentiator's own noise. Shared by both control laws.
        omega_ref_filter_hz: 2.0
        # SMC Rotational Control Parameters
        # Lambda_R: Natural frequency for attitude dynamics
        Lambda_R_x: 5.0
        Lambda_R_y: 5.0
        Lambda_R_z: 2.0
        # K_s_R: Rotational sliding mode gain
        K_s_R_x: 0.4
        K_s_R_y: 0.4
        K_s_R_z: 0.2
        # Phi_R: Saturation layer for rotational control
        Phi_R_x: 0.35
        Phi_R_y: 0.35
        Phi_R_z: 0.3

        # ===== STSMC (super-twisting) gains, only read when controller_type:=stsmc =====
        # UNTUNED starting point, deliberately conservative. Tune before real flight.
        # STA_Lambda: sliding surface slope (same role as Lambda above)
        STA_Lambda_x: 1.5
        STA_Lambda_y: 1.5
        STA_Lambda_z: 3.0
        # STA_K1/K2: super-twisting reaching-law gains (u = -K1*sqrt(|s|)*sign(s) + w, w_dot = -K2*sign(s))
        STA_K1_x: 0.7
        STA_K1_y: 0.7
        STA_K1_z: 1.0
        STA_K2_x: 0.3
        STA_K2_y: 0.3
        STA_K2_z: 0.5
        # Generalised STA linear terms, TRANSLATIONAL (roadmap item 10). Zero =
        # classical law, bit-exact. The sqrt branch makes very little FORCE at
        # small |s| (0.7*sqrt(0.1) = 0.22 N against PX4's 0.75 N at the same
        # velocity error), and against a displacement-growing disturbance the law
        # needs authority EARLY. -K3*s supplies it.
        #
        # ADOPTED 9 Sep at K3 = 6, K4 = 1 (translational XY only; z stays
        # classical). It is a deliberate TRADE, measured on the km-0.018 plant:
        #   7.5 m/s @ 90 deg : 0/2 fly-away  ->  2/2 landed (79-127 cm)
        #   5 m/s success    : 5/6           ->  6/6
        #   5 m/s CEP50      : 3.16 cm       ->  6.32 cm   <- the cost
        # Robustness up, absolute accuracy in benign wind roughly halved. Accepted
        # because the accuracy loss never crosses the 30 cm bar while the
        # robustness gain removes fly-aways. Scheduling K3 on the operating point
        # (small when benign, large when |s_xy| grows) is the obvious refinement
        # and is deliberately NOT done yet.
        STA_K3_x: 0.0
        STA_K3_y: 0.0
        STA_K3_z: 0.0
        STA_K4_x: 0.0
        STA_K4_y: 0.0
        STA_K4_z: 0.0
        # STA_Lambda_R: rotational sliding surface slope (same role as Lambda_R above)
        STA_Lambda_R_x: 5.0
        STA_Lambda_R_y: 5.0
        STA_Lambda_R_z: 2.0
        # STA_K1_R/K2_R: rotational super-twisting reaching-law gains.
        # HALVED from the original 0.5/0.5/0.15 and 0.1/0.1/0.03. Two reasons, one
        # theoretical and one measured:
        #   - §05's argument, now that item 8 estimates the disturbance: the
        #     reaching gains only have to bound the ESTIMATION ERROR, not the
        #     disturbance itself, which is the standard route to smaller gains.
        #   - measured: with omega_ref filtered, halving these takes tau_y TV/s from
        #     15% of baseline to 4%, the tilt rate limiter from 0.8% of steps to
        #     0.00%, and the servo's slew duty from 15% of its rate limit to 4.0%.
        # Touchdown XY IMPROVED with them (1.4 cm vs 4.4 cm baseline, n=3).
        #
        # The TRANSLATIONAL K1/K2 above are deliberately NOT halved: they are the
        # outer loop's authority against wind, and halving them as well cost a
        # factor of two on touchdown XY (9.7 cm, n=3). The attitude loop is where
        # the chattering lives; the translational loop is where the precision does.
        #
        # DO NOT QUARTER THESE. It was tried on 20 Aug and it is the most
        # tempting bad idea in this file: in still air it is a clean 3x win on
        # every chattering criterion at once (motor HF 0.00058 -> 0.00020, tilt
        # HF 0.061 -> 0.016, slew duty 3.9% -> 1.3%, no range overlap at n=4)
        # with station keeping unchanged. It then LANDED 0 OF 3 in a 5 m/s
        # tail-on wind: the aircraft cannot hold the descent cone (0.34 m against
        # a 0.33 m cone at 0.95 m), the tag leaves frame, and the ladder climbs
        # and aborts.
        #
        # The still-air rig cannot see that cost BY CONSTRUCTION, and this is the
        # general lesson: K2_R drives the rotational integral state w_R_, which
        # is what cancels a steady aerodynamic moment. Still air has no steady
        # moment, so the rig that scores chattering has nothing for the reaching
        # gains to reject and reports their removal as free. Any cut to these
        # must be flown tail-on before it is believed.
        STA_K1_R_x: 0.25
        STA_K1_R_y: 0.25
        # HARDWARE halves these two; see config/exp/t2_hw_gains.yaml.
        STA_K1_R_z: 0.075
        STA_K2_R_x: 0.05
        STA_K2_R_y: 0.05
        STA_K2_R_z: 0.015
        # ---- Geometric PID alternative for the ROTATIONAL loop ----------------
        # false = BIT-EXACT the super-twisting law, so this A/Bs against one binary.
        # The attitude loop is NOT the limiting factor (thrust-direction error
        # 0.2 deg p50, 0% motor saturation), so this is not a performance fix. It
        # exists because the rotational STA runs at HALF authority for chattering
        # reasons and a non-switching law carries no such trade.
        # Gains: kR = J*wn^2, kW = 2*zeta*J*wn at the SAME wn Lambda_R sets (5,5,2
        # rad/s), zeta 0.8 -- so the comparison is of reaching laws, not tunings.
        geometric_rot: false
        GEO_KR_x: 2.022
        GEO_KR_y: 3.140
        GEO_KR_z: 0.815
        GEO_KW_x: 0.647
        GEO_KW_y: 1.005
        GEO_KW_z: 0.652
        GEO_KI_x: 0.405
        GEO_KI_y: 0.628
        GEO_KI_z: 0.163

        # ===== Barrier-function adaptive gain, TRANSLATIONAL XY ONLY =====
        # SHIPPED OFF: STA_adapt_l_max <= 1.0 leaves K1/K2 bit-for-bit as loaded
        # above, so this A/Bs against ONE BINARY like STA_implicit and K3/K4.
        #
        # One scalar L >= 1 is adapted and BOTH gains scale from it,
        # K1 *= sqrt(L) and K2 *= L -- Levant's own scalings, so the pair never
        # leaves the manifold the convergence proof needs. L is ALGEBRAIC in the
        # surface, not an integrator, so it cannot wind up, drift, or
        # overestimate:
        #
        #     L = 1 + kappa * x/(1-x),   x = min(LPF(|s_xy|)/epsilon, 1-)
        #
        # WHY XY ONLY. The Monte-Carlo says the failures split into two
        # populations needing OPPOSITE gain directions. Wind is the only MATCHED
        # additive disturbance, and more gain rejects it -- that is the
        # translational loop. ct is multiplicative input-gain uncertainty and tau
        # is unmodelled actuator lag; more gain makes both WORSE, and they act
        # through the attitude loop and the allocation. So the rotational pair
        # stays fixed (quartering it is a 3x still-air win that lands 0 of 3
        # tail-on) and z stays fixed (the commit descent has no wind term).
        #
        # epsilon is a PRESCRIBED BAND on |s_xy| in m/s -- set it from measured
        # flight data, not by guess; l_max is the authority ceiling.
        STA_adapt_l_max: 1.0
        STA_adapt_epsilon: 0.5
        STA_adapt_kappa: 0.25
        STA_adapt_filter_hz: 2.0

        # ===== Anti-windup split =====
        # The tilt servos are the YAW axis on this tricopter, so their clamp and
        # rate limiter say nothing about whether the TRANSLATIONAL wrench reached
        # the rotors -- yet both fed ONE flag that froze BOTH super-twisting
        # integrals. A steady lateral wind is exactly where the tilt works
        # hardest and the translational integral is most needed, and the MC found
        # the STSMC's whole deficit against PX4 at 7.5 m/s is at 90/135 deg
        # (0/12 against 11/12). false reproduces the combined flag bit-for-bit.
        antiwindup_split: false

        # Bound on the TRANSLATIONAL super-twisting integral w_, as a fraction of
        # hover thrust. 0.40 = 9.76 N is the historical value; w_ ramps at
        # K2 = 0.3 N/s, so it takes 32 s to fill and 32 s to empty -- the same
        # time scale as the 20-25 s position limit cycle measured at 7.5 m/s /
        # 90 deg. The existing anti-windup cannot see that cycle: it triggers on
        # ACTUATOR saturation and the motors are 0.0% saturated throughout. The
        # steady wind this term exists to reject is ~3 N.
        STA_w_limit_fraction: 0.40

        # Saturation [m] of the POSITION term inside the translational sliding
        # surface. s = e_v + Lambda*e_p demands a closing velocity of Lambda*e_p,
        # so at Lambda 1.5 an aircraft 3 m out is asked to close at 4.5 m/s while
        # Phase 2 caps the reference at 0.5 m/s. They agree only inside
        # v_max/Lambda = 0.33 m. 0.0 disables it (bit-exact the previous law).
        STA_ep_max: 0.0

    diagnostics:
        # /landing/sliding_surface, ON by default like every other diagnostic
        # here. It exists as a switch only so the diagnostic's own cost can be
        # measured: this node publishes four diagnostic topics per 100 Hz cycle
        # and the chattering metrics are sensitive to loop jitter, so the rig has
        # to be able to answer "does instrumenting it change it" about itself.
        publish_sliding_surface: true

/**:
  ros__parameters:
    control_gains:
        # SMC Translational Control Parameters
        # Lambda: Natural frequency parameters for position/velocity dynamics
        Lambda_x: 1.5
        Lambda_y: 1.5
        Lambda_z: 3.0
        # K_s: Sliding mode gain - increase for faster convergence/disturbance rejection
        K_s_x: 1.0
        K_s_y: 1.0
        K_s_z: 1.5
        # Phi: Saturation layer thickness - prevents chattering
        Phi_x: 0.3
        Phi_y: 0.3
        Phi_z: 0.1
        # SMC Rotational Control Parameters
        # Lambda_R: Natural frequency for attitude dynamics
        Lambda_R_x: 5.0
        Lambda_R_y: 5.0
        Lambda_R_z: 2.0
        # K_s_R: Rotational sliding mode gain
        K_s_R_x: 0.4
        K_s_R_y: 0.4
        K_s_R_z: 0.2
        # Phi_R: Saturation layer for rotational control
        Phi_R_x: 0.35
        Phi_R_y: 0.35
        Phi_R_z: 0.3

        # ===== STSMC (super-twisting) gains, only read when controller_type:=stsmc =====
        # UNTUNED starting point, deliberately conservative. Tune before real flight.
        # STA_Lambda: sliding surface slope (same role as Lambda above)
        STA_Lambda_x: 1.5
        STA_Lambda_y: 1.5
        STA_Lambda_z: 3.0
        # STA_K1/K2: super-twisting reaching-law gains (u = -K1*sqrt(|s|)*sign(s) + w, w_dot = -K2*sign(s))
        STA_K1_x: 0.7
        STA_K1_y: 0.7
        STA_K1_z: 1.0
        STA_K2_x: 0.3
        STA_K2_y: 0.3
        STA_K2_z: 0.5
        # STA_Lambda_R: rotational sliding surface slope (same role as Lambda_R above)
        STA_Lambda_R_x: 5.0
        STA_Lambda_R_y: 5.0
        STA_Lambda_R_z: 2.0
        # STA_K1_R/K2_R: rotational super-twisting reaching-law gains
        STA_K1_R_x: 0.5
        STA_K1_R_y: 0.5
        STA_K1_R_z: 0.15
        STA_K2_R_x: 0.1
        STA_K2_R_y: 0.1
        STA_K2_R_z: 0.03
/**:
  ros__parameters:
    uav_parameters:
      mass: 2.486                  # Kg (base + rotors)
      arm_length: 0.25             # m NOT USED
      num_of_arms: 3
      inertia:                     # Kg.m^2
        ixx: 0.0808685
        iyy: 0.1256707
        izz: 0.2036992
        ixy: 0.0
        # ixz: 0.0025341
        ixz: 0.0
        iyz: 0.0
      moment_constant: 0.05     # m
      thrust_constant: 1.6e-05   # N.s^2/rad^2
      gravity: 9.81                # m/s^2
      pitch_trim_deg: 0.0         # compensates the tiltrotor's natural mounting tilt
      omega_to_pwm_coefficient:
        x_2: 0.001142
        x_1: 0.2273
        x_0: 914.2
      PWM_MIN: 1075
      PWM_MAX: 1950
      SIM_GZ_EC_MAX: 1500        # rad/s, corresponds to SIM_GZ_EC_MAX from PX4 parameters
      SIM_GZ_EC_MIN: 0           # rad/s, corresponds to SIM_GZ_EC_MIN from PX4 parameters 10 AVANT
    landing_parameters:
      camera_frame_id: "t2_cruza_vtol_0/camera_link/imager"
      platform_frame_id: "platform"
      world_frame_id: "world"
      camera_offset_body:        # position of camera in body frame [m]
        x: 0.0
        y: 0.0
        z: -0.03
      # Detector interface for the pixel-space estimator (roadmap item 7).
      detections_topic: "/apriltag/detections"
      camera_info_topic: "/sensor/imager/camera_info"
      # The marker layout, which MUST match apriltag_ros_enhanced/cfg/tags_36h11.yaml:
      # two concentric tags at the platform centre. Corner positions are derived
      # from these, so a wrong size here is a scale error in the estimate.
      tag_ids: [2, 1]
      tag_families: ["Custom48h12", "36h11"]
      tag_sizes: [0.6, 0.16]
      tag_positions_x: [0.0, 0.0]
      tag_positions_y: [0.0, 0.0]
      tag_positions_z: [0.0, 0.0]
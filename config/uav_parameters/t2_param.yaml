/**:
  ros__parameters:
    uav_parameters:
      mass: 2.486                  # Kg (base + rotors)
      arm_length: 0.25             # m NOT USED
      num_of_arms: 3
      inertia:                     # Kg.m^2
        ixx: 0.0808685
        iyy: 0.1256707
        izz: 0.2036992
        ixy: 0.0
        # ixz: 0.0025341
        ixz: 0.0
        iyz: 0.0
      moment_constant: 0.018    # m  (datasheet-derived; was 0.05, inherited from PX4 generic tiltrotor)
      thrust_constant: 1.6e-05   # N.s^2/rad^2
      gravity: 9.81                # m/s^2
      pitch_trim_deg: 0.0         # compensates the tiltrotor's natural mounting tilt
      omega_to_pwm_coefficient:
        x_2: 0.001142
        x_1: 0.2273
        x_0: 914.2
      PWM_MIN: 1075
      PWM_MAX: 1950
      SIM_GZ_EC_MAX: 1139        # rad/s, corresponds to SIM_GZ_EC_MAX from PX4 parameters
      SIM_GZ_EC_MIN: 0           # rad/s, corresponds to SIM_GZ_EC_MIN from PX4 parameters 10 AVANT
      # ===== CONSTRAINED ALLOCATION (qp_allocator.h) =====
      # false = the 3x3 pseudo-inverse, BIT-EXACT the previous behaviour.
      #
      # The 3x3 form has no F_x row, so the body-x force a tilted nacelle makes
      # is a side effect nothing commands -- and `tilt_2 = -tilt_1` made common
      # mode identically zero, so the one DOF that can hold a head/tail wind
      # WITHOUT leaning was unusable. Measured 11 Sep over 78 fair draws: the
      # STSMC is 1/6 against PX4's 6/6 at 7.5 m/s nose-on, where the disturbance
      # is only ~2.4 N = 8.4 deg of common tilt.
      qp_allocation: false
      # Weight on tau_z in the allocation objective. Yaw is what to give up
      # first here: it is served by DIFFERENTIAL tilt, the same actuator that
      # makes body-x force, so under saturation the two compete directly. A
      # landing needs the heading roughly right and the position to centimetres.
      qp_yaw_weight: 0.25
      # Tilt servo rate limit [deg/s], as a CONSTRAINT rather than a post-hoc
      # clamp. The shipped 90 deg/s is a bare constant with no derivation; the
      # datasheet says 0.10 s/60 deg = 600 deg/s NO-LOAD at 6.0 V, so the usable
      # figure is likely 200-300 once load and gyroscopic reaction are allowed
      # for. This is the number to sweep.
      qp_tilt_rate_dps: 90.0
      # Rotor spin rate [rad/s] for the GYROSCOPIC term; 0 disables it. Tilting
      # a spinning rotor precesses: measured in the offline test, a DIFFERENTIAL
      # tilt at 90 deg/s makes 0.37 N.m of roll (12x the hover trim torque) while
      # a COMMON-MODE tilt cancels to 0.0000 -- the fronts spin opposite ways.
      qp_rotor_spin_rate: 0.0
      # SYMMETRIC tilt bound for the allocator [deg]. 6.5 reproduces the authority
      # the 3x3 path has always had. tilt_max_deg (90) is the SERVO's mechanical
      # travel for output mapping and must not be used here -- doing so let the
      # allocator command lean p95 of 77.8 deg and lose the aircraft.
      # Widening this is the experiment; it is not a default.
      qp_tilt_limit_deg: 6.5
      # Allocation objective weights. F_x is ALSO the gain of the split feedback
      # loop (the allocator is fed the remainder), so it trades authority against
      # stability: 1.0 served nearly the whole demand and oscillated, 0.5
      # converged but under-served and the aircraft drifted.
      qp_fx_weight: 1.0
      qp_fz_weight: 5.0
      # The CLOSED-FORM lean/tilt split, in degrees of common-mode tilt the
      # control law may assign to itself; 0.0 keeps the older one-cycle feedback
      # form and is bit-exact the previous behaviour.
      #
      # The law divides its own horizontal demand -- tilt first, attitude takes
      # the remainder -- and hands the allocator the same share IN THE SAME
      # CYCLE, so neither actuator can claim the same newton and there is no
      # loop to oscillate. The earlier form fed the achieved value forward one
      # cycle and was marginal at an F_x weight of 1.0.
      #
      # Only the LONGITUDINAL axis is contestable: both nacelles rotate about
      # body y, so the tilt makes body-x force and nothing else. Lateral wind is
      # roll's problem whatever this is set to.
      qp_tilt_split_deg: 0.0
      # Degrees of tilt held back for YAW, which is differential tilt on this
      # airframe. The two nacelles are never at the same angle, so the
      # common-mode angle that makes body-x force is their MEAN, not the stop.
      # The rotor-drag term alone holds +-2.4 deg at hover (km 0.018), and
      # without this reserve the split sized its share on the stop and the
      # allocator quietly delivered 0.12 N less -- which lands nowhere, because
      # the attitude had already been told to serve the remainder.
      qp_tilt_yaw_reserve_deg: 2.0
    landing_parameters:
      # ===== Reference generation (roadmap item 11) =====
      # Bandwidth [rad/s] of the third-order reference model. 0.0 keeps the old
      # low-pass-and-difference path, so the two A/B against one binary.
      #
      # The old path made the reference ACCELERATION proportional to the raw
      # velocity command at a gain of lpf_alpha/dt = 20, so a step in the steering
      # estimate reached the force feedforward at 49.7 N per metre -- measured at
      # 1.115 N peak against a 0.026 N mean in a steady hold, from a 2.2 cm jump.
      # The tag updates discretely, so those steps are not noise to be filtered;
      # they are how the measurement arrives. Here the acceleration is a STATE, so
      # a jump moves the jerk instead, and max_jerk bounds how fast the
      # feedforward can move at all: one step can change it by at most
      # m*j_max*dt = 0.199 N, whatever the jump.
      #
      # 8 rad/s is well above the translational loop's own ~1.5 rad/s (Lambda) and
      # well below the ~20-25 rad/s the old filter ran at, which was far faster
      # than anything downstream could use.
      reference_model_bandwidth: 8.0
      reference_model_damping: 1.0        # critically damped: a velocity reference
                                          # that overshoots commands the vehicle
                                          # past the point it was asked to reach
      reference_model_max_jerk_xy: 8.0    # [m/s^3]
      reference_model_max_jerk_z: 4.0     # [m/s^3]
      camera_frame_id: "t2_cruza_vtol_0/camera_link/imager"
      platform_frame_id: "platform"
      world_frame_id: "world"
      # Position of the camera's optical centre in body FLU [m]. Read off the
      # SDF, not guessed: t2_cruza_vtol/model.sdf includes mono_cam at
      # <pose>0 0 -0.10 0 1.5707 0</pose>, base_link is at the model origin
      # (<pose>0 0 0 ...>), and the imager sensor sits at the camera_link origin.
      # So the optical centre is 0.10 m below the body origin.
      #
      # This was -0.03 for the whole project -- a 7 cm error, which is a 2.3%
      # scale error on the projection at 3 m and 23% at 0.3 m. It is the thing
      # extrinsic_sigma in the filter was standing in for.
      camera_offset_body:
        x: 0.0
        y: 0.0
        z: -0.10
      # Detector interface for the pixel-space estimator (roadmap item 7).
      detections_topic: "/apriltag/detections"
      camera_info_topic: "/sensor/imager/camera_info"
      # The marker layout, which MUST match apriltag_ros_enhanced/cfg/tags_36h11.yaml:
      # two concentric tags at the platform centre. Corner positions are derived
      # from these, so a wrong size here is a scale error in the estimate.
      # Horizontal authority of the guidance. The STSMC TRACKS this reference and
      # its damping term brakes the aircraft above it, so in wind these are a
      # hard ceiling on recovery. PX4's arm is not subject to them (it closes the
      # position loop itself at MPC_XY_VEL_MAX), which is the asymmetry behind
      # the 90/135 deg Monte-Carlo result. 0.5 / 1.0 / 0.8 are the historical values.
      # Phase 2 XY reference bounding. The legacy integration is open-loop and
      # driven by the VEHICLE's error, so a displaced vehicle drives the
      # reference through the pad and out the far side, and the law then flies
      # the vehicle after it -- measured as a 9.6 m limit cycle at 7.5 m/s/90 deg
      # with the commanded force pointing away from the pad 67% of the time.
      # 0.0 / false reproduce that legacy behaviour exactly.
      # Phase 1 -> 2 handover gate [m]. 0.3 is the historical value.
      phase2_max_velocity_z: 0.6
      cone_slope: 0.30
      # Terminal descent. Measured: commit at 0.097 m -> touchdown 0.725 m, i.e.
      # 60+ cm lost in the 2 s open-loop commit. 0.4/false are the historical values.
      commit_descent_rate: 0.6
      # ADOPTED 9 Sep, after a REVERT THAT WAS BASED ON INVALID EVIDENCE.
      # It was briefly reverted for an apparent 5 m/s / 90 deg regression
      # (29.15/8.35 -> 38.10/FLEW). Reading the phase log showed neither of those
      # runs EVER REACHED PHASE 3 -- both failed in Phase 2, pushed 0.30-0.36 m
      # outside the descent cone at 0.7-0.8 m altitude -- and this parameter only
      # exists inside updatePhase3Commit(). The change was not executing. The
      # 5 m/s / 90 deg cell is simply marginal on its own.
      #
      # MEASUREMENT RULE: before attributing a failure to a change, confirm the
      # change was on the code path the failure took. This is the second time in
      # this investigation a null/regression was pinned on an inactive knob.
      #
      # Keeping XY steering through the commit descent, gated on a
      # genuinely fresh tag (falls back to the frozen point otherwise). Measured
      # at 7.5 m/s / 90 deg, n=4 each: median 142 -> 71 cm and the spread 57-174
      # -> 69-86 cm. The VARIANCE collapse is the real result: the aircraft
      # oscillates about the pad (0.2-0.4 m, 5.7 s period) and the frozen commit
      # inherits that swing as run-to-run scatter, while steering keeps fighting.
      # It works through the reference VELOCITY, not the target: freezing sets
      # r_v_xy = 0 so the damping term only opposes absolute motion, whereas
      # steering points r_v at the pad and enlarges e_v when drifting away.
      commit_steer_xy: true
      # SETTLED COMMIT GATE (0.0 = disabled = bit-exact the instantaneous gate).
      # The alignment test fires AT an oscillation crossing -- peak lateral speed
      # -- and the blind descent turns that speed into miss distance. 48.6% of
      # the campaign's STSMC failures are that shape.
      commit_max_speed_xy: 0.0
      commit_settle_seconds: 0.0
      # The timeout fallback used to commit at ANY error (observed 3.137 m,
      # reported as "Landing complete"). 0.0 = no ceiling = previous behaviour.
      commit_fallback_xy_max: 0.0
      xy_error_threshold: 0.3
      phase2_reference_leash: 0.0
      phase2_reference_settles: false
      max_velocity_xy: 1.0
      phase2_max_velocity_xy: 0.5
      phase2_max_acceleration_xy: 0.8
      # Ramp rate for the terminal descent. At 0.3 m/s^2 a 0.8 m/s commit rate needs
      # 1.67 s and the phase only lasts ~1.45 s, so commit_descent_rate is inert
      # above ~0.45 m/s. This is what actually sets the blind-descent exposure.
      phase2_max_acceleration_z: 0.3
      # Sustained-alignment filter on the descent throttle. An oscillating aircraft
      # crosses the cone axis every swing; instantaneously that unlocks the full
      # descent rate at the worst moment. 0.0 = instantaneous = previous law.
      descent_alignment_filter_hz: 0.0
      # The frozen two-marker layout, at the REAL sizes. To re-run the third-marker
      # A/B, add id 3 / "36h11" / 0.035 here and set TAG3_SIZE=0.035 in the
      # environment; it was measured on 9 Sep as 3/18 against 3/18, i.e. no effect.
      tag_ids: [2, 1]
      tag_families: ["Custom48h12", "36h11"]
      tag_sizes: [0.35, 0.091]
      tag_positions_x: [0.0, 0.0]
      tag_positions_y: [0.0, 0.0]
      tag_positions_z: [0.0, 0.0]